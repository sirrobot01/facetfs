name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  static:
    name: Static and race checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: CGO-free tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Static build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
